name: Deploy Docker

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'

jobs:
  image-creating:
    runs-on: ubuntu-latest
    # needs: [ quality-backend, quality-frontend ]
    strategy:
      matrix:
        include:
          - name: backend_K
            context: backend
            dockerfile: backend/Dockerfile
            tags: ghcr.io/${{ github.repository_owner }}/backend:latest
          - name: frontend_K
            context: frontend
            dockerfile: frontend/Dockerfile
            tags: ghcr.io/${{ github.repository_owner }}/frontend:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push image for ${{ matrix.name }}
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.tags }}
          push: true

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{secrets.AWS_HOST}}
          username: ${{secrets.AWS_USER}}
          key: ${{secrets.AWS_SSH_KEY_K}}
          script: |
            # login to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # Navigate to the deployment directory
            cd ~/app
            # Pull the latest images and restart services
            docker-compose pull
            docker-compose up -d --remove-orphans