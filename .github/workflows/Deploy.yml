name: Build & Push Images

on:
  push:
    branches:
      - feature/ci-cd-docker   # ta branch de travail

permissions:
  contents: read
  packages: write   # 🔴 IMPORTANT pour GHCR

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            image: ghcr.io/${{ github.repository_owner }}/boutique-backend
          - name: frontend
            context: ./frontend
            image: ghcr.io/${{ github.repository_owner }}/boutique-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ✅ LOGIN GHCR AVEC GITHUB_TOKEN (PAS DE PAT)
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}